<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官能基テスト</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="quiz.css">
    <!-- 標準的なファビコン（16x16 / 32x32など） -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.ico">

    <!-- Apple Touch Icon (iPhoneなど) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>

<body class="quiz-page">

    <header class="header">
        <div class="header-inner">
            <a href="https://study.kikuchan-code.workers.dev/" class="logo">
                <p class="logo-subtitle">高専生の基礎学習をサポート</p>
                <span class="logo-title">Base Study Hub <em class="logo-em">KOSEN</em></span>
            </a>

            <button class="hamburger" id="hamburger" aria-label="メニューを開く">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav" id="nav">
                <ul class="nav-list">
                    <li><a href="../index.html#works">有機化学</a></li>
                    <li><a href="https://study.kikuchan-code.workers.dev/">ホームにもどる</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="section">
            <div class="container">

                <nav class="breadcrumb" aria-label="パンくずリスト">
                    <a href="https://study.kikuchan-code.workers.dev/">教材置き場</a> &gt; <a href="../index.html">化学</a>
                    &gt; <span>官能基テスト</span>
                </nav>

                <h2 class="section-title">官能基テスト</h2>

                <div class="description">
                    R<sub>1</sub>, R<sub>2</sub> は <strong>R1</strong>, <strong>R2</strong> と入力してください。<br>
                    炭化水素類は <strong>R</strong> と表します。
                </div>

                <div class="controls">
                    <div class="controls-group">
                        <label for="hole-count">1行あたりの穴の数</label>
                        <input type="number" id="hole-count" min="1" max="6" value="1">
                    </div>
                    <div class="buttons">
                        <button type="button" id="blank-button">虫食いにする</button>
                        <button type="button" id="check-button">正誤判定</button>
                        <button type="button" id="show-answers-button">正解表示</button>
                    </div>
                    <div id="score-result" class="score" role="status" aria-live="polite"></div>
                </div>

                <div class="table-wrap">
                    <table id="functional-groups-table" class="data-table">
                        <thead>
                            <tr>
                                <th>官能基</th>
                                <th>構造式</th>
                                <th>化合物名</th>
                                <th>化合物構造</th>
                                <th>代表例</th>
                                <th>代表構造</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <p class="footer-note">入力後「正誤判定」で採点できます。</p>

            </div>
        </section>
    </main>

    <button id="toTopBtn" class="to-top-btn" title="上へ戻る">
        <span aria-hidden="true" class="to-top-icon"></span>
    </button>

    <script src="../script.js"></script>
    <script src="quiz.js"></script>
    <script>
        const data = [
            {
                name: 'ヒドロキシ基',
                structure: '-OH',
                compoundName: 'アルコール',
                compoundStructure: 'R-OH',
                organicCompoundName: 'エタノール',
                organicCompoundStructure: 'C2H5OH'
            },
            {
                name: 'ヒドロキシ基',
                structure: '-OH',
                compoundName: 'フェノール類',
                compoundStructure: 'R-OH',
                organicCompoundName: 'フェノール',
                organicCompoundStructure: 'C6H5OH'
            },
            {
                name: 'エーテル結合',
                structure: '-O-',
                compoundName: 'エーテル',
                compoundStructure: 'R1-O-R2',
                organicCompoundName: 'ジエチルエーテル',
                organicCompoundStructure: 'C2H5OC2H5'
            },
            {
                name: 'ホルミル基',
                structure: '-CHO',
                compoundName: 'アルデヒド',
                compoundStructure: 'R-CHO',
                organicCompoundName: 'アセトアルデヒド',
                organicCompoundStructure: 'CH3CHO'
            },
            {
                name: 'カルボニル基',
                structure: '-CO-',
                compoundName: 'ケトン',
                compoundStructure: 'R1-CO-R2',
                organicCompoundName: 'アセトン',
                organicCompoundStructure: 'CH3COCH3'
            },
            {
                name: 'カルボキシ基',
                structure: '-COOH',
                compoundName: 'カルボン酸',
                compoundStructure: 'R-COOH',
                organicCompoundName: '酢酸',
                organicCompoundStructure: 'CH3COOH'
            },
            {
                name: 'エステル結合',
                structure: '-COO-',
                compoundName: 'エステル',
                compoundStructure: 'R1-COO-R2',
                organicCompoundName: '酢酸エチル',
                organicCompoundStructure: 'CH3COOC2H5'
            },
            {
                name: 'ニトロ基',
                structure: '-NO2',
                compoundName: 'ニトロ化合物',
                compoundStructure: 'R-NO2',
                organicCompoundName: 'ニトロベンゼン',
                organicCompoundStructure: 'C6H5NO2'
            },
            {
                name: 'アミノ基',
                structure: '-NH2',
                compoundName: 'アミン',
                compoundStructure: 'R-NH2',
                organicCompoundName: 'アニリン',
                organicCompoundStructure: 'C6H5NH2'
            },
            {
                name: 'スルホ基',
                structure: '-SO3H',
                compoundName: 'スルホン酸',
                compoundStructure: 'R-SO3H',
                organicCompoundName: 'ベンゼンスルホン酸',
                organicCompoundStructure: 'C6H5SO3H'
            },
        ];

        const tableBody = document.querySelector('#functional-groups-table tbody');

        // ヒドロキシ基の行（アルコール／フェノール類）を区別するための重要列
        // 2:化合物名  4:代表例  5:代表構造
        const protectedCols = [2, 4, 5];

        function createTable() {
            tableBody.innerHTML = '';
            data.forEach(item => {
                const row = document.createElement('tr');
                Object.values(item).forEach(text => {
                    const cell = document.createElement('td');
                    cell.textContent = text;
                    row.appendChild(cell);
                });
                tableBody.appendChild(row);
            });
        }

        function maxHoles() {
            return window.matchMedia('(max-width:800px)').matches ? 5 : 6;
        }

        function buildBlanks() {
            const holeCount = Quiz.readInt('hole-count', 1, maxHoles(), 1);

            createTable();

            Array.from(tableBody.rows).forEach((row, rowIndex) => {
                const item = data[rowIndex];
                const cells = Array.from(row.cells);
                const hiddenCols = [];

                for (const index of Quiz.shuffle([0, 1, 2, 3, 4, 5])) {
                    if (hiddenCols.length >= holeCount) break;

                    // ヒドロキシ基だけ特別ルール：重要列を全部穴にするのは禁止
                    if (item.name === 'ヒドロキシ基' && protectedCols.includes(index)) {
                        const hiddenProtected = hiddenCols.filter(x => protectedCols.includes(x));
                        if (hiddenProtected.length >= protectedCols.length - 1) continue;
                    }

                    Quiz.makeInput(cells[index]);
                    hiddenCols.push(index);
                }
            });
        }

        Quiz.init(buildBlanks);
        createTable();
    </script>
</body>

</html>
