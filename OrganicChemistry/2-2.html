<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官能基テスト</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="quiz.css">
    <!-- 標準的なファビコン（16x16 / 32x32など） -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.ico">

    <!-- Apple Touch Icon (iPhoneなど) -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>

<body class="quiz-page">

    <header class="header">
        <div class="header-inner">
            <a href="https://study.kikuchan-code.workers.dev/" class="logo">
                <p class="logo-subtitle">高専生の基礎学習をサポート</p>
                <span class="logo-title">Base Study Hub <em class="logo-em">KOSEN</em></span>
            </a>

            <button class="hamburger" id="hamburger" aria-label="メニューを開く">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav" id="nav">
                <ul class="nav-list">
                    <li><a href="../index.html#works">有機化学</a></li>
                    <li><a href="https://study.kikuchan-code.workers.dev/">ホームにもどる</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="section">
            <div class="container">

                <nav class="breadcrumb" aria-label="パンくずリスト">
                    <a href="https://study.kikuchan-code.workers.dev/">ホーム</a> &gt; <a href="../index.html">有機化学</a> &gt; <span>脂肪族炭化水素テスト</span>
                </nav>

                <h2 class="section-title">脂肪族炭化水素テスト</h2>

                <div class="description">
                    存在しない場合は、<strong>存在しない</strong>と答えること。
                </div>

                <div class="controls">
                    <div class="controls-group">
                        <label for="hole-count">1行あたりの穴の数</label>
                        <input type="number" id="hole-count" min="1" max="9" value="1">
                    </div>
                    <div class="controls-group">
                        <label><input type="checkbox" id="shuffle-rows"> ランダムに行を入れ替える</label>
                    </div>
                    <div class="buttons">
                        <button type="button" id="blank-button">虫食いにする</button>
                        <button type="button" id="check-button">正誤判定</button>
                        <button type="button" id="show-answers-button">正解表示</button>
                    </div>
                    <div id="score-result" class="score" role="status" aria-live="polite"></div>
                </div>

                <div class="table-wrap">
                    <table id="chemical-table" class="data-table wide">
                        <thead>
                        <tr>
                        <th>No.</th>
                        <th>ギリシア語の数詞</th>
                        <th>アルカン 物質名</th>
                        <th>アルカン 化学式</th>
                        <th>アルケン 物質名</th>
                        <th>アルケン 化学式</th>
                        <th>アルキン 物質名</th>
                        <th>アルキン 化学式</th>
                        <th>アルキル基 物質名</th>
                        <th>アルキル基 化学式</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <p class="footer-note">入力後「正誤判定」で採点できます。</p>

            </div>
        </section>
    </main>

    <button id="toTopBtn" class="to-top-btn" title="上へ戻る">
        <span aria-hidden="true" class="to-top-icon"></span>
    </button>

    <script src="../script.js"></script>
    <script src="quiz.js"></script>
    <script>
const data = [
            { greek: 'mono', alkane: { name: 'methane', formula: 'CH4' }, alkene: { name: '存在しない', formula: '存在しない' }, alkyne: { name: '存在しない', formula: '存在しない' }, alkyl: { name: 'methyl基', formula: 'CH3-' } },
            { greek: 'di', alkane: { name: 'ethane', formula: 'C2H6' }, alkene: { name: 'ethene', formula: 'C2H4' }, alkyne: { name: 'ethyne', formula: 'C2H2' }, alkyl: { name: 'ethyl基', formula: 'C2H5-' } },
            { greek: 'tri', alkane: { name: 'propane', formula: 'C3H8' }, alkene: { name: 'propene', formula: 'C3H6' }, alkyne: { name: 'propyne', formula: 'C3H4' }, alkyl: { name: 'propyl基', formula: 'C3H7-' } },
            { greek: 'tetra', alkane: { name: 'butane', formula: 'C4H10' }, alkene: { name: 'butene', formula: 'C4H8' }, alkyne: { name: 'butyne', formula: 'C4H6' }, alkyl: { name: 'butyl基', formula: 'C4H9-' } },
            { greek: 'penta', alkane: { name: 'pentane', formula: 'C5H12' }, alkene: { name: 'pentene', formula: 'C5H10' }, alkyne: { name: 'pentyne', formula: 'C5H8' }, alkyl: { name: 'pentyl基', formula: 'C5H11-' } },
            { greek: 'hexa', alkane: { name: 'hexane', formula: 'C6H14' }, alkene: { name: 'hexene', formula: 'C6H12' }, alkyne: { name: 'hexyne', formula: 'C6H10' }, alkyl: { name: 'hexyl基', formula: 'C6H13-' } },
            { greek: 'hepta', alkane: { name: 'heptane', formula: 'C7H16' }, alkene: { name: 'heptene', formula: 'C7H14' }, alkyne: { name: 'heptyne', formula: 'C7H12' }, alkyl: { name: 'heptyl基', formula: 'C7H15-' } },
            { greek: 'octa', alkane: { name: 'octane', formula: 'C8H18' }, alkene: { name: 'octene', formula: 'C8H16' }, alkyne: { name: 'octyne', formula: 'C8H14' }, alkyl: { name: 'octyl基', formula: 'C8H17-' } },
            { greek: 'nona', alkane: { name: 'nonane', formula: 'C9H20' }, alkene: { name: 'nonene', formula: 'C9H18' }, alkyne: { name: 'nonyne', formula: 'C9H16' }, alkyl: { name: 'nonyl基', formula: 'C9H19-' } },
            { greek: 'deca', alkane: { name: 'decane', formula: 'C10H22' }, alkene: { name: 'decene', formula: 'C10H20' }, alkyne: { name: 'decyne', formula: 'C10H18' }, alkyl: { name: 'decyl基', formula: 'C10H21-' } }
        ];

        const tbody = document.querySelector('#chemical-table tbody');

        function createTable() {
            tbody.innerHTML = '';
            data.forEach((item, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.greek}</td>
                    <td>${item.alkane.name}</td>
                    <td>${item.alkane.formula}</td>
                    <td>${item.alkene.name}</td>
                    <td>${item.alkene.formula}</td>
                    <td>${item.alkyne.name}</td>
                    <td>${item.alkyne.formula}</td>
                    <td>${item.alkyl.name}</td>
                    <td>${item.alkyl.formula}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function buildBlanks() {
            const holeCount = Quiz.readInt('hole-count', 1, 9, 1);
            const shuffleRows = document.getElementById('shuffle-rows').checked;

            createTable();   // 並びも元に戻る

            let rows = Array.from(tbody.rows);
            if (shuffleRows) {
                Quiz.shuffle(rows).forEach(row => tbody.appendChild(row));
            }

            rows.forEach(row => {
                const cells = Array.from(row.cells).slice(1);   // No. 列は穴にしない
                Quiz.shuffle(cells).slice(0, holeCount).forEach(cell => Quiz.makeInput(cell));
            });
        }

        Quiz.init(buildBlanks);
        createTable();
    </script>
</body>

</html>
