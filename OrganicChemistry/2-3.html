<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官能基テスト</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="quiz.css">
    <!-- 標準的なファビコン（16x16 / 32x32など） -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.ico">

    <!-- Apple Touch Icon (iPhoneなど) -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>

<body class="quiz-page">

    <header class="header">
        <div class="header-inner">
            <a href="https://study.kikuchan-code.workers.dev/" class="logo">
                <p class="logo-subtitle">高専生の基礎学習をサポート</p>
                <span class="logo-title"><em class="logo-em">S.K.</em> Base Study Hub</span>
            </a>

            <button class="hamburger" id="hamburger" aria-label="メニューを開く">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav" id="nav">
                <ul class="nav-list">
                    <li><a href="../index.html#works">有機化学</a></li>
                    <li><a href="https://study.kikuchan-code.workers.dev/">ホームにもどる</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="section">
            <div class="container">

                <nav class="breadcrumb" aria-label="パンくずリスト">
                    <a href="https://study.kikuchan-code.workers.dev/">ホーム</a> &gt; <a href="../index.html">有機化学</a> &gt; <span>脂肪族炭化水素 日本語←→英語</span>
                </nav>

                <h2 class="section-title">脂肪族炭化水素 日本語←→英語</h2>

                <div class="description">
                    存在しない場合は、<strong>存在しない</strong>と答えること。
                </div>

                <div class="controls">
                    <div class="controls-group">
                        <label for="hole-count">1行あたりの穴の数</label>
                        <input type="number" id="hole-count" min="1" max="8" value="3">
                    </div>
                    <div class="controls-group">
                        <label><input type="checkbox" id="shuffle-rows"> ランダムに行を入れ替える</label>
                    </div>
                    <div class="buttons">
                        <button type="button" id="blank-button">虫食いにする</button>
                        <button type="button" id="check-button">正誤判定</button>
                        <button type="button" id="show-answers-button">正解表示</button>
                    </div>
                    <div id="score-result" class="score" role="status" aria-live="polite"></div>
                </div>

                <div class="table-wrap">
                    <table id="chemTable" class="data-table wide">
                        <thead>
                        <tr>
                        <th>炭素数</th>
                        <th>アルカン (英語)</th>
                        <th>アルカン (日本語)</th>
                        <th>アルケン (英語)</th>
                        <th>アルケン (日本語)</th>
                        <th>アルキン (英語)</th>
                        <th>アルキン (日本語)</th>
                        <th>アルキル基(英語)</th>
                        <th>アルキル基 (日本語)</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <p class="footer-note">入力後「正誤判定」で採点できます。</p>

            </div>
        </section>
    </main>

    <button id="toTopBtn" class="to-top-btn" title="上へ戻る">
        <span aria-hidden="true" class="to-top-icon"></span>
    </button>

    <script src="../script.js"></script>
    <script src="quiz.js"></script>
    <script>
const data = [
            { carbon: 1, alkane: ['methane', 'メタン'], alkene: ['存在しない', '存在しない'], alkyne: ['存在しない', '存在しない'], alkylgroup: ['methyl基', 'メチル基'] },
            { carbon: 2, alkane: ['ethane', 'エタン'], alkene: ['ethene', 'エテン'], alkyne: ['ethyne', 'エチン'], alkylgroup: ['ethyl基', 'エチル基'] },
            { carbon: '2 (慣用)', alkane: ['ethane', 'エタン'], alkene: ['ethylene', 'エチレン'], alkyne: ['acetylene', 'アセチレン'], alkylgroup: ['ethyl基', 'エチル基'] },
            { carbon: 3, alkane: ['propane', 'プロパン'], alkene: ['propene', 'プロペン'], alkyne: ['propyne', 'プロピン'], alkylgroup: ['propyl基', 'プロピル基'] },
            { carbon: 4, alkane: ['butane', 'ブタン'], alkene: ['butene', 'ブテン'], alkyne: ['butyne', 'ブチン'], alkylgroup: ['butyl基', 'ブチル基'] },
            { carbon: 5, alkane: ['pentane', 'ペンタン'], alkene: ['pentene', 'ペンテン'], alkyne: ['pentyne', 'ペンチン'], alkylgroup: ['pentyl基', 'ペンチル基'] },
            { carbon: 6, alkane: ['hexane', 'ヘキサン'], alkene: ['hexene', 'ヘキセン'], alkyne: ['hexyne', 'ヘキシン'], alkylgroup: ['hexyl基', 'ヘキシル基'] },
            { carbon: 7, alkane: ['heptane', 'ヘプタン'], alkene: ['heptene', 'ヘプテン'], alkyne: ['heptyne', 'ヘプチン'], alkylgroup: ['heptyl基', 'ヘプチル基'] },
            { carbon: 8, alkane: ['octane', 'オクタン'], alkene: ['octene', 'オクテン'], alkyne: ['octyne', 'オクチン'], alkylgroup: ['octyl基', 'オクチル基'] },
            { carbon: 9, alkane: ['nonane', 'ノナン'], alkene: ['nonene', 'ノネン'], alkyne: ['nonyne', 'ノニン'], alkylgroup: ['nonyl基', 'ノニル基'] },
            { carbon: 10, alkane: ['decane', 'デカン'], alkene: ['decene', 'デセン'], alkyne: ['decyne', 'デシン'], alkylgroup: ['decyl基', 'デシル基'] }
        ];

        const tbody = document.querySelector('#chemTable tbody');

        function populateTable() {
            tbody.innerHTML = '';
            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.carbon}</td>
                    <td>${item.alkane[0]}</td>
                    <td>${item.alkane[1]}</td>
                    <td>${item.alkene[0]}</td>
                    <td>${item.alkene[1]}</td>
                    <td>${item.alkyne[0]}</td>
                    <td>${item.alkyne[1]}</td>
                    <td>${item.alkylgroup[0]}</td>
                    <td>${item.alkylgroup[1]}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function buildBlanks() {
            const holeCount = Quiz.readInt('hole-count', 1, 8, 3);
            const shuffleRows = document.getElementById('shuffle-rows').checked;

            populateTable();   // 並びも元に戻る

            const rows = Array.from(tbody.rows);
            if (shuffleRows) {
                Quiz.shuffle(rows).forEach(row => tbody.appendChild(row));
            }

            rows.forEach(row => {
                const cells = Array.from(row.cells).slice(1);   // 炭素数の列は穴にしない
                Quiz.shuffle(cells).slice(0, holeCount).forEach(cell => Quiz.makeInput(cell));
            });
        }

        Quiz.init(buildBlanks);
        populateTable();
    </script>
</body>

</html>
